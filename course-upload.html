<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090909"><title>Private course upload | David Wix</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090909;color:#f7f7f4;font:15px/1.6 Arial,sans-serif}.panel{width:min(560px,100%);padding:32px;border:1px solid #303030;background:#121212}.eyebrow{font:11px monospace;letter-spacing:.16em;color:#d8ff4f}h1{font-size:32px;line-height:1.1;margin:14px 0}p{color:#aaa}label{display:block;margin:20px 0 8px;font-size:13px}input{width:100%;padding:13px;background:#080808;border:1px solid #444;color:white}button{width:100%;padding:14px;margin-top:16px;border:0;background:#d8ff4f;color:#090909;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.status{min-height:24px;color:#d8ff4f;font-size:13px;margin-top:14px}.hint{font-size:12px;color:#888}
</style></head><body><main class="panel"><div class="eyebrow">DAVID WIX · PRIVATE FILE STORAGE</div><h1>Upload course PDFs</h1><p>Files are stored in private Vercel Blob storage. They are not placed in the public website repository.</p>
<form id="uploadForm">
<label for="password">Upload password</label><input id="password" type="password" autocomplete="current-password" required>
<label for="frontend">Front-End Web Development for Beginners</label><input id="frontend" type="file" accept="application/pdf,.pdf" required>
<label for="threeD">3D Website Design & Client Acquisition</label><input id="threeD" type="file" accept="application/pdf,.pdf" required>
<button id="submit" type="submit">Upload both private PDFs</button><div class="status" id="status" role="status" aria-live="polite"></div>
</form><p class="hint">Use only the approved course PDF files. Do not share this page or your password.</p></main>
<script>
const form=document.querySelector("#uploadForm"),button=document.querySelector("#submit"),status=document.querySelector("#status");
form.addEventListener("submit",async event=>{
 event.preventDefault();const password=document.querySelector("#password").value;
 const files=[
  {input:document.querySelector("#frontend"),name:"front-end-web-development-beginners.pdf",label:"Front-End course"},
  {input:document.querySelector("#threeD"),name:"3d-website-design-client-acquisition.pdf",label:"3D course"}
 ];
 if(files.some(x=>!x.input.files[0]||x.input.files[0].type!=="application/pdf")){status.textContent="Select both PDF files before uploading.";return}
 button.disabled=true;
 try{
  for(const item of files){
   const file=item.input.files[0];
   if(file.size>2*1024*1024)throw new Error(item.label+" PDF is larger than 2 MB.");
   const bytes=new Uint8Array(await file.arrayBuffer());
   let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
   status.textContent="Uploading "+item.label+" privately…";
   const response=await fetch("/api/course-upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pathname:item.name,password,fileBase64:btoa(binary)})});
   const result=await response.json();
   if(!response.ok)throw new Error(result.error||"Upload failed.");
  }
  status.textContent="Both PDFs were uploaded to private storage successfully.";
  form.reset();
 }catch(error){status.textContent=error.message||"Upload failed. Please try again."}
 finally{button.disabled=false}
});
</script></body></html>
